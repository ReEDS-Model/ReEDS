name: reeds_framework_comparison
description: ReEDS LP framework comparison run by Torc with per-job resource monitoring

execution_config:
  mode: direct

resource_monitor:
  sample_interval_seconds: 1
  jobs:
    enabled: true
    granularity: summary
  compute_node:
    enabled: false

jobs:
  - name: install_gamspy_scip
    command: uv run --project tests/framework_comparison gamspy install solver scip --use-uv
    resource_requirements: framework_job

  - name: bench_linopy_highs_{size}
    command: >
      uv run --project tests/framework_comparison python
      tests/framework_comparison/run_framework.py
      --label linopy_highs
      --module solve_linopy
      --solver highs
      --size {size}
      --output tests/framework_comparison/torc_output/framework_results/{size}_linopy_highs.json
    resource_requirements: framework_job
    parameters:
      size: "['small']"

  - name: bench_pyomo_highs_{size}
    command: >
      uv run --project tests/framework_comparison python
      tests/framework_comparison/run_framework.py
      --label pyomo_highs
      --module solve_pyomo
      --solver highs
      --size {size}
      --output tests/framework_comparison/torc_output/framework_results/{size}_pyomo_highs.json
    resource_requirements: framework_job
    parameters:
      size: "['small']"

  - name: bench_pyomo_scip_{size}
    command: >
      uv run --project tests/framework_comparison python
      tests/framework_comparison/run_framework.py
      --label pyomo_scip
      --module solve_pyomo
