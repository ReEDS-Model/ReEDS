### For use with casemaker.py.
##############
### Shared ###
### Shared settings are applied to all cases.
### Any settings not specified use the defaults from cases.csv.
shared:
  yearset: 2010_2015_2020..2050..3

##################
### Dimensions ###
### Scenario names are formatted as '{dimension1}_{dimension2}_{etc}',
### so to avoid ambiguity, avoid the use of underscores (_) in dimension elements.
### To use the default settings from cases.csv, provide an empty dictionary: {}.
dimensions:
  shock:
    2xprice:
      GSw_priceshock_one: 1
      GSw_matprice_multiplier: 2
      GSw_mat_restrict: 1
      GSw_mat_domestic: 1
      GSw_mat_glb: 1
      GSw_mat_allies: 0
      GSw_mat_byproduct: 0
    4xprice:
      GSw_priceshock_one: 1
      GSw_matprice_multiplier: 4
      GSw_mat_restrict: 1
      GSw_mat_domestic: 1
      GSw_mat_glb: 1
      GSw_mat_allies: 0
      GSw_mat_byproduct: 0
    8xprice:
      GSw_priceshock_one: 1
      GSw_matprice_multiplier: 8
      GSw_mat_restrict: 1
      GSw_mat_domestic: 1
      GSw_mat_glb: 1
      GSw_mat_allies: 0
      GSw_mat_byproduct: 0
    nosupply:
      GSw_mat_restrict: 1
      GSw_mat_domestic: 1
      GSw_mat_glb: 1
      GSw_mat_allies: 0
      GSw_mat_byproduct: 0
    domestic:
      GSw_mat_restrict: 1
      GSw_mat_domestic: 1
      GSw_mat_glb: 0
      GSw_mat_allies: 0
      GSw_mat_byproduct: 0
    quarterdomestic:
      GSw_mat_restrict: 1
      GSw_mat_domestic: 1
      GSw_mat_glb: 0
      GSw_mat_allies: 0
      GSw_mat_byproduct: 0
      GSw_prod_multiplier_usa: 0.25
    allies:
      GSw_mat_restrict: 1
      GSw_mat_domestic: 1
      GSw_mat_glb: 0
      GSw_mat_allies: 1
      GSw_mat_byproduct: 0
  duration: 
    long: 
      GSw_years_matshock: "2029,2032,2035,2038,2041"
    med:
      GSw_years_matshock: "2029,2032,2035"
    short:
      GSw_years_matshock: "2029"
    volatile: 
      GSw_years_matshock: "2029,2035,2041"
  material:
    all: {}
    aluminumprice:
      GSw_matprice_spec: Aluminum
    aluminumsupply:
      GSw_matsupply_spec: Aluminum
    cobaltprice:
      GSw_matprice_spec: Cobalt
    cobaltsupply:
