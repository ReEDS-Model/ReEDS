      GSw_matsupply_spec: Gallium
    hafniumprice:
      GSw_matprice_spec: Hafnium
    hafniumsupply:
      GSw_matsupply_spec: Hafnium
    indiumprice:
      GSw_matprice_spec: Indium
    indiumsupply:
      GSw_matsupply_spec: Indium
    lithiumprice:
      GSw_matprice_spec: Lithium
    lithiumsupply:
