### For use with casemaker.py.
##############
### Shared ###
### Shared settings are applied to all cases.
### Any settings not specified use the defaults from cases.csv.
shared:
  yearset: 2010..2026..1_2030
  endyear: 2030
  GSw_Region: country/USA
  GSw_GasCurve: 1
  GSw_TransHurdleRate: 1
  GSw_TransHurdleLevel1: transgrp
  GSw_TransHurdleLevel2: st
  GSw_Geothermal: 2
  GSw_GrowthPenalties: 1
  GSw_Upstream: 1

##################
### Dimensions ###
### Scenario names are formatted as '{dimension1}_{dimension2}_{etc}',
### so to avoid ambiguity, avoid the use of underscores (_) in dimension elements.
### To use the default settings from cases.csv, provide an empty dictionary: {}.
dimensions:
  HurdleRate1:
    HR2:
      GSw_TransHurdleStart1: 2
    HR4:
      GSw_TransHurdleStart1: 4
    HR6:
      GSw_TransHurdleStart1: 6
    HR8:
      GSw_TransHurdleStart1: 8
    HR10:
      GSw_TransHurdleStart1: 10
    HR12:
      GSw_TransHurdleStart1: 12
    HR14:
      GSw_TransHurdleStart1: 14
    HR16:
      GSw_TransHurdleStart1: 16
    HR18:
      GSw_TransHurdleStart1: 18
    HR20:
      GSw_TransHurdleStart1: 20
  HurdleRate2:
    HR2:
      GSw_TransHurdleStart2: 2
    HR4:
      GSw_TransHurdleStart2: 4
    HR6:
      GSw_TransHurdleStart2: 6
    HR8:
      GSw_TransHurdleStart2: 8
    HR10:
      GSw_TransHurdleStart2: 10
    HR12:
      GSw_TransHurdleStart2: 12
    HR14:
      GSw_TransHurdleStart2: 14
    HR16:
      GSw_TransHurdleStart2: 16
    HR18:
      GSw_TransHurdleStart2: 18
    HR20:
      GSw_TransHurdleStart2: 20
##################
### Casegroups ###
### Entries must follow the same order as dimensions; i.e., if the dimensions are
### [policy, demand, sensitivity], the casegroup entries must be in that order.
### If an empty list is given, expand to all the options in that dimension;
### otherwise, use only the listed elements.
### Single elements can be provided as a length-1 list or as a string.
### Duplicates will be filtered out in casemaker.py.
casegroups:
  ## All sensitivity scenarios
  - [[], []]
