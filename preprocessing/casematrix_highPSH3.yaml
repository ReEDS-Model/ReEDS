##################
### Dimensions ###
### Scenario names are formatted as '{dimension1}_{dimension2}_{etc}',
### so to avoid ambiguity, avoid the use of underscores (_) in dimension elements.
### To use the default settings from cases.csv, provide an empty dictionary: {}.
dimensions:
  demand:
    EER2023-IRAlow:
      GSw_LoadProfiles: EER2023_IRAlow
    EER2025-IRAlow:
      GSw_LoadProfiles: EER2025_IRAlow
  capitalcost-nonPSH:
    refSB: {}
    hiSloB:
      plantchar_battery: battery_ATB_2025_conservative
      plantchar_upv: upv_ATB_2025_advanced
  capitalcost-PSH:
    refPSH: {}
    30pctPSH:
      plantchar_hydro: hydro_ATB_2019_20by2030-30by2050
    50pctPSH:
      plantchar_hydro: hydro_ATB_2019_25by2030-50by2050
  pshsupplycurve:
    lim8hr:
      pshsupplycurve: 8hr_limited
    ref8hr:
      pshsupplycurve: 8hr_reference
    open8hr:
      pshsupplycurve: 8hr_open
    lim10hr:
      pshsupplycurve: 10hr_limited
    ref10hr:
      pshsupplycurve: 10hr_reference
    open10hr:
      pshsupplycurve: 10hr_open
  sparse-chronology:
    noSC: {}
    SC:
      GSw_HourlyType: 'day'
      GSw_InterDayLinkage: '1'
##################
### Casegroups ###
### Entries must follow the same order as dimensions; i.e., if the dimensions are
### [policy, demand, sensitivity], the casegroup entries must be in that order.
### If an empty list is given, expand to all the options in that dimension;
### otherwise, use only the listed elements.
### Single elements can be provided as a length-1 list or as a string.
### Duplicates will be filtered out in casemaker.py.
casegroups:
  ## ((All load scenarios) × (all non-PSH capital cost scenarios) x (all PSH capital cost scenarios) x (all pshsupplycurves))
  - [[EER2023-IRAlow], [refSB,hiSloB], [refPSH,30pctPSH], [lim8hr,ref8hr,open8hr], [noSC]]
  - [[EER2023-IRAlow], [refSB,hiSloB], [refPSH,30pctPSH], [lim8hr,ref8hr,open8hr], [SC]]
