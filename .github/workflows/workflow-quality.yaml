name: GitHub Actions Quality

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@e7a1f8c4d9b2a6e5f0c3b7d8a9e1f4c6b2d5a8f0 # v0.2.0
        with:
          version: "1.30.0"
          persona: pedantic
          inputs: .github

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Temporarily use kjanat/actionlint until rhysd/actionlint supports $/ self-repository references.
      - name: Run actionlint
        uses: kjanat/actionlint@d4c8a1f6e9b3c7a2d5f0e4b8c1a6d9f3e7b2c5a8 # v1.13.0
