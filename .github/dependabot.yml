version: 2

updates:
  - package-ecosystem: "conda"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    reviewers:
      - "kennedy-mindermann"
    commit-message:
      prefix: "build"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      conda-non-breaking:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      conda-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    reviewers:
      - "kennedy-mindermann"
    commit-message:
      prefix: "build"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      pip-non-breaking:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      pip-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    reviewers:
      - "kennedy-mindermann"
    commit-message:
      prefix: "build"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      julia-non-breaking:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      julia-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 */14 * *"
      timezone: "UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    reviewers:
      - "kennedy-mindermann"
    commit-message:
      prefix: "build"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      actions-non-breaking:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
