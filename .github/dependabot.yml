version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 6 */14 * *"
      timezone: "UTC"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    reviewers:
      - "kennedy-mindermann"
    commit-message:
      prefix: "build"
      include: "scope"
    rebase-strategy: "auto"
    groups:
      actions-non-breaking:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
